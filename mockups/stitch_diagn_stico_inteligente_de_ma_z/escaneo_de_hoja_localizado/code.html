<script>
        let isFlashOn = false;
        const flashIcon = document.getElementById('flashIcon');
        const flashBtn = document.getElementById('flashToggle');

        function toggleFlash() {
            isFlashOn = !isFlashOn;
            if (isFlashOn) {
                flashIcon.textContent = 'flash_on';
                flashIcon.style.fontVariationSettings = "'FILL' 1";
                flashBtn.classList.remove('bg-black/30');
                flashBtn.classList.add('bg-primary-container', 'text-on-primary-container');
            } else {
                flashIcon.textContent = 'flash_off';
                flashIcon.style.fontVariationSettings = "'FILL' 0";
                flashBtn.classList.add('bg-black/30');
                flashBtn.classList.remove('bg-primary-container', 'text-on-primary-container');
            }
        }

        function simulateUpload() {
            // Visual feedback for interaction
            console.log('Opening native file picker...');
        }

        // Haptic feel for buttons
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', () => {
                if (window.navigator.vibrate) {
                    window.navigator.vibrate(10);
                }
            });
        });
    </script>
