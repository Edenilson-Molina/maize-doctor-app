<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col items-center justify-center p-gutter">
<!-- Subtle atmospheric background effect -->
<div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
<div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] rounded-full bg-primary-fixed opacity-20 blur-[120px]"></div>
<div class="absolute -bottom-[10%] -right-[10%] w-[30%] h-[30%] rounded-full bg-secondary-fixed opacity-20 blur-[100px]"></div>
</div>
<!-- Registration Container -->
<main class="w-full max-w-[420px] z-10">
<!-- Header / Logo Section -->
<div class="flex flex-col items-center mb-stack-md animate-fade-in-up">
<div class="w-24 h-24 mb-4 drop-shadow-sm transition-transform hover:scale-105 duration-300">
<img alt="DoctorMaiz Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCjtSV-_taxRUQ8WrsbXLW0EitfGinYxNmOC-3ygohN410kHNSWWbhkPN9_5U0mSBw9tYcH1u2XmHMmgcbl_lma1tC2NukGi9o6BA9PdrqbV5m9tKv53RGksrr29Brwdr97IdOG2bEB5nAJWa3_siFzgrHvr4-zc1BMxaHVPYdg7XNYQMgC8G1rgercnFSC6wH59mi7_Arr2n_84PyiqfFVEqlmf-dvRLojLZr9eLZ0bJWZh0_xUJiIDTAuvSla8MDI5A"/>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">Crea tu cuenta</h1>
<p class="text-on-surface-variant font-body-md text-center mt-2 px-4">
                Únete a la plataforma líder en diagnóstico agrícola de precisión.
            </p>
</div>
<!-- Registration Card -->
<section class="bg-surface-container-lowest rounded-xl shadow-lg border border-outline-variant p-gutter sm:p-stack-md transition-all">
<form action="#" class="flex flex-col gap-5" onsubmit="event.preventDefault();">
<!-- Full Name -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-2" for="full_name">
<span class="material-symbols-outlined text-[18px]">person</span>
                        Nombre Completo
                    </label>
<input class="h-touch-target bg-surface-container-low border border-outline-variant rounded-lg px-4 text-on-surface font-body-md input-focus-ring transition-all placeholder:text-outline" id="full_name" placeholder="Ej. Juan Pérez" required="" type="text"/>
</div>
<!-- Email -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-2" for="email">
<span class="material-symbols-outlined text-[18px]">mail</span>
                        Correo Electrónico
                    </label>
<input class="h-touch-target bg-surface-container-low border border-outline-variant rounded-lg px-4 text-on-surface font-body-md input-focus-ring transition-all placeholder:text-outline" id="email" placeholder="usuario@campo.com" required="" type="email"/>
</div>
<!-- Password -->
<div class="flex flex-col gap-2 relative">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-2" for="password">
<span class="material-symbols-outlined text-[18px]">lock</span>
                        Contraseña
                    </label>
<div class="relative">
<input class="w-full h-touch-target bg-surface-container-low border border-outline-variant rounded-lg px-4 text-on-surface font-body-md input-focus-ring transition-all placeholder:text-outline" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors h-8 w-8 flex items-center justify-center" onclick="togglePassword('password')" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Confirm Password -->
<div class="flex flex-col gap-2 relative">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-2" for="confirm_password">
<span class="material-symbols-outlined text-[18px]">verified_user</span>
                        Confirmar Contraseña
                    </label>
<div class="relative">
<input class="w-full h-touch-target bg-surface-container-low border border-outline-variant rounded-lg px-4 text-on-surface font-body-md input-focus-ring transition-all placeholder:text-outline" id="confirm_password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors h-8 w-8 flex items-center justify-center" onclick="togglePassword('confirm_password')" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Registration Action -->
<button class="mt-2 h-touch-target bg-primary text-on-primary font-headline-sm text-headline-sm rounded-full shadow-sm hover:bg-primary-container active:scale-95 transition-all flex items-center justify-center gap-2" type="submit">
                    Registrarse

</button>

<div class="flex-grow h-[1px] bg-outline-variant"></div>

<div class="grid grid-cols-1 gap-3">

<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>

</p>
<div class="mt-12 flex justify-center gap-6 text-outline text-[12px] font-label-md uppercase tracking-widest">
<span>Privacidad</span>
<span>Términos</span>
<span>Soporte</span>
</div>

<!-- Micro-interactions Script -->
<script>
        function togglePassword(id) {
            const input = document.getElementById(id);
            const icon = input.nextElementSibling.querySelector('.material-symbols-outlined');
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerText = 'visibility_off';
            } else {
                input.type = 'password';
                icon.innerText = 'visibility';
            }
        }

        // Simple check for password matching UI hint
        const pass = document.getElementById('password');
        const confirm = document.getElementById('confirm_password');
        
        [pass, confirm].forEach(el => {
            el.addEventListener('input', () => {
                if (confirm.value !== '' && pass.value !== confirm.value) {
                    confirm.classList.add('border-error');
                    confirm.classList.remove('border-outline-variant');
                } else {
                    confirm.classList.remove('border-error');
                    confirm.classList.add('border-outline-variant');
                }
            });
        });
    </script>
<style>
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
