<body class="font-body-md text-on-background min-h-screen flex flex-col relative overflow-hidden">

<main class="flex-1 flex flex-col items-center justify-center px-container-padding py-stack-md z-10">
<!-- Logo Section -->

</div>
<!-- Login Card -->
<div class="w-full max-w-sm bg-surface-container-lowest border border-outline-variant/30 rounded-xl shadow-lg p-8 transition-all hover:shadow-xl" style="--mouse-x: 342px; --mouse-y: 381px;">
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-6">Iniciar Sesión</h2>
<form action="#" class="space-y-stack-sm" method="POST">
<!-- Email Input -->
<div class="space-y-1">
<label class="block font-label-md text-label-md text-on-surface-variant px-1" for="email">Correo Electrónico</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full h-touch-target pl-11 pr-4 bg-surface rounded-lg border-2 border-outline-variant focus:border-primary focus:ring-0 transition-all font-body-md text-on-surface placeholder:text-outline/50" id="email" name="email" placeholder="ejemplo@correo.com" required="" type="email">
</div>
</div>
<!-- Password Input -->
<div class="space-y-1">
<div class="flex justify-between items-center px-1">
<label class="block font-label-md text-label-md text-on-surface-variant" for="password">Contraseña</label>

</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full h-touch-target pl-11 pr-12 bg-surface rounded-lg border-2 border-outline-variant focus:border-primary focus:ring-0 transition-all font-body-md text-on-surface placeholder:text-outline/50" id="password" name="password" placeholder="••••••••" required="" type="password">
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="password-toggle-icon">visibility</span>
</button>
</div>
<div class="flex justify-center px-1 mt-2">

</div></div>

<span class="material-symbols-outlined" style="font-variation-settings: &quot;FILL&quot; 1;">login</span>
                    Entrar
                </button>

<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('password-toggle-icon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                toggleIcon.textContent = 'visibility';
            }
        }

        // Add subtle hover effect to the login card
        document.querySelector('.bg-surface-container-lowest').addEventListener('mousemove', (e) => {
            const card = e.currentTarget;
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            card.style.setProperty('--mouse-x', `${x}px`);
            card.style.setProperty('--mouse-y', `${y}px`);
        });
    </script>
<style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.6s ease-out forwards;
        }
        
        /* Subtle glow effect on card */
        .bg-surface-container-lowest {
            position: relative;
        }
        .bg-surface-container-lowest::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(400px circle at var(--mouse-x, 0) var(--mouse-y, 0), rgba(1, 45, 29, 0.03), transparent 40%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .bg-surface-container-lowest:hover::before {
            opacity: 1;
        }
    </style>
